<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up | Sindh Safe City</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">
      <div class="brand-mark"><i data-lucide="shield-check"></i></div>
      <div><h1>Sindh Safe City</h1><p>AI Surveillance & Smart Enforcement</p></div>
    </div>
    <h2>Create account</h2>
    <p class="auth-subtitle">Register a new management account.</p>
    <form id="authForm" novalidate>
      <div class="form-group">
        <label for="fullName">Full name</label>
        <div class="input-wrap"><i data-lucide="user"></i><input id="fullName" type="text" autocomplete="name" placeholder="Your full name"></div>
        <div class="field-error"></div>
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <div class="input-wrap"><i data-lucide="mail"></i><input id="email" type="email" autocomplete="email" placeholder="officer@safecity.pk"></div>
        <div class="field-error"></div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap"><i data-lucide="lock-keyhole"></i><input id="password" type="password" autocomplete="new-password" placeholder="Minimum 8 characters"></div>
        <div class="field-error"></div>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <div class="input-wrap"><i data-lucide="lock-keyhole"></i><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter password"></div>
        <div class="field-error"></div>
      </div>
      <button class="btn btn-primary btn-block" id="submitButton" type="submit">Register</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
